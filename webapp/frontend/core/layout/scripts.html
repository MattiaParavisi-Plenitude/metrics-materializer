<!-- Bootstrap Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Success Modal -->
<div class="modal fade" id="successModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-body text-center p-5">
        <div class="mb-4">
          <i class="bi bi-check-circle-fill text-success" style="font-size: 3.5rem;"></i>
        </div>
        <h5 class="mb-3 fw-bold">Success</h5>
        <p class="text-muted mb-4" id="successMessage">Operation completed successfully.</p>
        <button type="button" class="btn btn-pln-green px-4" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Error Modal -->
<div class="modal fade" id="errorModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-body text-center p-5">
        <div class="mb-4">
          <i class="bi bi-x-circle-fill text-danger" style="font-size: 3.5rem;"></i>
        </div>
        <h5 class="mb-3 fw-bold">Error</h5>
        <p class="text-muted mb-4" id="errorMessage">An error occurred. Please try again.</p>
        <button type="button" class="btn btn-danger px-4" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Confirm Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold"><i class="bi bi-question-circle-fill text-warning me-2"></i>Confirm Action</h5>
      </div>
      <div class="modal-body pt-3" id="confirmMessage"></div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-pln-green" id="btnConfirmOk">Confirm</button>
      </div>
    </div>
  </div>
</div>

<script>
  function showSuccess(message) {
    document.getElementById('successMessage').textContent = message;
    new bootstrap.Modal(document.getElementById('successModal')).show();
  }

  function showError(message) {
    document.getElementById('errorMessage').textContent = message;
    new bootstrap.Modal(document.getElementById('errorModal')).show();
  }

  function showConfirm(html) {
    return new Promise(resolve => {
      const modalEl = document.getElementById('confirmModal');
      document.getElementById('confirmMessage').innerHTML = html;
      const modal = new bootstrap.Modal(modalEl);
      let confirmed = false;
      document.getElementById('btnConfirmOk').addEventListener('click', function () {
        confirmed = true;
        modal.hide();
      }, { once: true });
      modalEl.addEventListener('hidden.bs.modal', function () {
        resolve(confirmed);
      }, { once: true });
      modal.show();
    });
  }
</script>
