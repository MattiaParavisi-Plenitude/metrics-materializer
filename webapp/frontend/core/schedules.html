{% extends 'core/page_layout.html' %}
{% block content %}
<div class="container mt-5">
  <h2 class="mb-4 fw-bold"><i class="bi bi-gear me-2"></i>Manage Schedules</h2>

  <div id="jobsContainer">
    <p class="text-muted text-center my-4">
      <span class="spinner-border spinner-border-sm me-2"></span>Loading scheduled jobs...
    </p>
  </div>
</div>

<!-- Reschedule Modal -->
<div class="modal fade" id="rescheduleModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold"><i class="bi bi-calendar-event me-2"></i>Reschedule Job</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p>Job: <strong id="modalJobName"></strong></p>
        <div class="mb-3">
          <label for="modalCron" class="form-label fw-semibold">CRON Expression (Quartz)</label>
          <input type="text" class="form-control" id="modalCron" placeholder="0 0 6 * * ?">
          <div class="form-text"><code>seconds minutes hours day-of-month month day-of-week</code></div>
        </div>
        <div class="mb-3">
          <label for="modalTimezone" class="form-label fw-semibold">Timezone</label>
          <select class="form-select" id="modalTimezone">
            <option value="Europe/Rome">Europe/Rome</option>
            <option value="UTC">UTC</option>
            <option value="Europe/London">Europe/London</option>
            <option value="Europe/Berlin">Europe/Berlin</option>
            <option value="US/Eastern">US/Eastern</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="btnConfirmReschedule">
          <i class="bi bi-check-lg me-1"></i>Update Schedule
        </button>
      </div>
    </div>
  </div>
</div>
{% endblock content %}

{% block extra_js %}
<script>
(function() {
  const $container = document.getElementById('jobsContainer');
  let currentJobId = null;

  async function loadJobs() {
    $container.innerHTML = '<p class="text-muted text-center my-4"><span class="spinner-border spinner-border-sm me-2"></span>Loading...</p>';

    try {
      const resp = await fetch('/api/registry/jobs');
      const data = await resp.json();
      if (!data.success) throw new Error(data.error || 'Failed to load jobs');

      const jobs = data.jobs || [];
      if (jobs.length === 0) {
        $container.innerHTML = '<div class="alert alert-info"><i class="bi bi-info-circle me-2"></i>No scheduled jobs found. Go to <a href="/schedule">Schedule</a> to create one.</div>';
        return;
      }

      let html = '';
      jobs.forEach(job => {
        html += `
          <div class="card mb-4 shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
              <div>
                <h5 class="mb-0 fw-bold"><code>${job.job_name}</code></h5>
                <small class="text-muted">Job ID: ${job.job_id}</small>
              </div>
              <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-success btn-run-now" data-job-id="${job.job_id}" title="Trigger immediate run">
                  <i class="bi bi-play-fill me-1"></i>Run Now
                </button>
                <button class="btn btn-outline-info btn-refresh-status" data-job-id="${job.job_id}" title="Refresh live status">
                  <i class="bi bi-arrow-clockwise me-1"></i>Status
                </button>
                <button class="btn btn-outline-warning btn-reschedule" data-job-id="${job.job_id}" data-job-name="${job.job_name}" data-cron="${job.cron_expression}" data-tz="${job.timezone}">
                  <i class="bi bi-calendar-event me-1"></i>Reschedule
                </button>
              </div>
            </div>
            <div class="card-body">
              <div class="row mb-3">
                <div class="col-md-6">
                  <strong>Schedule:</strong> <code>${job.cron_expression}</code>
                  <span class="text-muted ms-2">(${job.timezone})</span>
                </div>
                <div class="col-md-6 text-end">
                  <strong>${job.metrics.length}</strong> metric(s)
                </div>
              </div>
              <!-- Live status panel (populated on demand) -->
              <div class="mb-3 d-none" id="status-${job.job_id}"></div>
              <div class="table-responsive">
                <table class="table table-sm table-hover mb-0">
                  <thead class="table-light">
                    <tr>
                      <th>Metric</th>
                      <th>Type</th>
                      <th>Assigned</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody>
                    ${job.metrics.map(m => `
                      <tr>
                        <td><strong>${m.metric_name}</strong></td>
                        <td><span class="badge ${m.extraction_type && m.extraction_type.toUpperCase() === 'SNAPSHOT' ? 'bg-primary' : 'bg-secondary'}">${m.extraction_type || '?'}</span></td>
                        <td><small class="text-muted">${m.assigned_at ? new Date(m.assigned_at).toLocaleDateString() : '-'}</small></td>
                        <td><button class="btn btn-sm btn-outline-danger py-0 btn-remove-metric" data-metric="${m.metric_name}" data-job-id="${job.job_id}" title="Remove from schedule"><i class="bi bi-x-lg"></i></button></td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>`;
      });

      $container.innerHTML = html;

      // Attach reschedule handlers
      document.querySelectorAll('.btn-reschedule').forEach(btn => {
        btn.addEventListener('click', function() {
          currentJobId = this.dataset.jobId;
          document.getElementById('modalJobName').textContent = this.dataset.jobName;
          document.getElementById('modalCron').value = this.dataset.cron;
          document.getElementById('modalTimezone').value = this.dataset.tz;
          const modal = new bootstrap.Modal(document.getElementById('rescheduleModal'));
          modal.show();
        });
      });

      // Attach remove metric handlers
      document.querySelectorAll('.btn-remove-metric').forEach(btn => {
        btn.addEventListener('click', async function() {
          const metric = this.dataset.metric;
          const jobId = this.dataset.jobId;

          this.disabled = true;
          this.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

          try {
            // Step 1: Preview what would be removed
            const previewResp = await fetch('/api/registry/remove-metric', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ metric_name: metric, job_id: jobId, preview: true }),
            });
            const preview = await previewResp.json();
            if (!preview.success) throw new Error(preview.error || 'Failed to preview');

            const removeList = preview.metrics_to_remove || [metric];
            const willDelete = preview.will_delete_job;

            // Step 2: Show detailed confirmation
            let confirmHtml = `<p>Removing <strong>"${escapeHtml(metric)}"</strong> will also remove the following metrics (dependencies + dependents):</p><ul class="mb-2">`;
            confirmHtml += removeList.map(m => `<li><code>${escapeHtml(m)}</code></li>`).join('');
            confirmHtml += '</ul>';
            if (willDelete) {
              confirmHtml += '<div class="alert alert-warning py-2 mb-0"><i class="bi bi-exclamation-triangle me-1"></i>This will <strong>DELETE the entire job</strong> (no metrics left).</div>';
            }

            if (!await showConfirm(confirmHtml)) {
              this.disabled = false;
              this.innerHTML = '<i class="bi bi-x-lg"></i>';
              return;
            }

            // Step 3: Execute removal with confirmation
            const resp = await fetch('/api/registry/remove-metric', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ metric_name: metric, job_id: jobId, confirmed: true }),
            });
            const data = await resp.json();
            if (!data.success) throw new Error(data.error || 'Failed to remove');

            loadJobs();
          } catch (err) {
            showError(err.message);
            this.disabled = false;
            this.innerHTML = '<i class="bi bi-x-lg"></i>';
          }
        });
      });

      // Attach Run Now handlers
      document.querySelectorAll('.btn-run-now').forEach(btn => {
        btn.addEventListener('click', async function() {
          const jobId = this.dataset.jobId;
          if (!await showConfirm('Trigger an immediate run of this job?')) return;

          this.disabled = true;
          this.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Triggering...';
          try {
            const resp = await fetch('/api/run-now', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ job_id: jobId }),
            });
            const data = await resp.json();
            if (!data.success) throw new Error(data.error || 'Failed to trigger');
            this.innerHTML = '<i class="bi bi-check-lg me-1"></i>Triggered';
            this.classList.remove('btn-outline-success');
            this.classList.add('btn-success');
            // Show run link in status panel
            const panel = document.getElementById('status-' + jobId);
            panel.classList.remove('d-none');
            panel.innerHTML = `
              <div class="alert alert-success py-2 mb-0">
                <i class="bi bi-check-circle me-2"></i>Run triggered — ID: <strong>${data.run_id}</strong>
                <a href="${data.run_page_url}" target="_blank" class="btn btn-sm btn-outline-primary ms-2"><i class="bi bi-box-arrow-up-right me-1"></i>View</a>
              </div>`;
            setTimeout(() => {
              this.disabled = false;
              this.innerHTML = '<i class="bi bi-play-fill me-1"></i>Run Now';
              this.classList.remove('btn-success');
              this.classList.add('btn-outline-success');
            }, 3000);
          } catch (err) {
            showError(err.message);
            this.disabled = false;
            this.innerHTML = '<i class="bi bi-play-fill me-1"></i>Run Now';
          }
        });
      });

      // Attach Refresh Status handlers
      document.querySelectorAll('.btn-refresh-status').forEach(btn => {
        btn.addEventListener('click', async function() {
          const jobId = this.dataset.jobId;
          this.disabled = true;
          this.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Loading...';

          try {
            const resp = await fetch('/api/job-status', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ job_id: jobId }),
            });
            const data = await resp.json();
            if (!data.success) throw new Error(data.error || 'Failed to fetch status');

            const panel = document.getElementById('status-' + jobId);
            panel.classList.remove('d-none');

            if (!data.runs || data.runs.length === 0) {
              panel.innerHTML = '<div class="alert alert-secondary py-2 mb-0"><i class="bi bi-info-circle me-2"></i>No runs found for this job.</div>';
            } else {
              let statusHtml = '<div class="border rounded p-2"><h6 class="fw-bold mb-2"><i class="bi bi-activity me-1"></i>Recent Runs</h6><div class="table-responsive"><table class="table table-sm table-bordered mb-0"><thead><tr><th>Run</th><th>State</th><th>Result</th><th>Started</th><th>Tasks</th><th></th></tr></thead><tbody>';
              data.runs.forEach(run => {
                const stateClass = run.state === 'TERMINATED' ? (run.result === 'SUCCESS' ? 'text-success' : 'text-danger') : 'text-warning';
                const resultBadge = run.result ? `<span class="badge ${run.result === 'SUCCESS' ? 'bg-success' : 'bg-danger'}">${run.result}</span>` : '<span class="badge bg-warning">RUNNING</span>';
                const startTime = run.start_time ? new Date(run.start_time).toLocaleString() : '-';
                const taskSummary = run.tasks && run.tasks.length > 0
                  ? run.tasks.map(t => {
                      const icon = t.result === 'SUCCESS' ? '✓' : (t.result === 'FAILED' ? '✗' : '⏳');
                      return `<small class="${t.result === 'SUCCESS' ? 'text-success' : (t.result === 'FAILED' ? 'text-danger' : 'text-warning')}">${icon} ${t.task_key}</small>`;
                    }).join('<br>')
                  : '-';
                statusHtml += `<tr><td><small>${run.run_id}</small></td><td class="${stateClass}">${run.state}</td><td>${resultBadge}</td><td><small>${startTime}</small></td><td>${taskSummary}</td><td>${run.run_page_url ? `<a href="${run.run_page_url}" target="_blank" class="btn btn-sm btn-outline-primary py-0"><i class="bi bi-box-arrow-up-right"></i></a>` : ''}</td></tr>`;
              });
              statusHtml += '</tbody></table></div></div>';
              panel.innerHTML = statusHtml;
            }
          } catch (err) {
            const panel = document.getElementById('status-' + jobId);
            panel.classList.remove('d-none');
            panel.innerHTML = `<div class="alert alert-danger py-2 mb-0">${err.message}</div>`;
          } finally {
            this.disabled = false;
            this.innerHTML = '<i class="bi bi-arrow-clockwise me-1"></i>Status';
          }
        });
      });

    } catch (err) {
      $container.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
    }
  }

  // ── Confirm Reschedule ───────────────────────────────────────────────────
  document.getElementById('btnConfirmReschedule').addEventListener('click', async function() {
    const cron = document.getElementById('modalCron').value.trim();
    const tz = document.getElementById('modalTimezone').value;

    if (!cron) { showError('Please enter a CRON expression.'); return; }
    if (!currentJobId) return;

    this.disabled = true;
    this.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Updating...';

    try {
      const resp = await fetch('/api/reschedule', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          job_id: currentJobId,
          cron_expression: cron,
          timezone: tz,
        }),
      });
      const data = await resp.json();
      if (!data.success) throw new Error(data.error || 'Failed to reschedule');

      // Close modal and reload
      bootstrap.Modal.getInstance(document.getElementById('rescheduleModal')).hide();
      loadJobs();
    } catch (err) {
      showError(err.message);
    } finally {
      this.disabled = false;
      this.innerHTML = '<i class="bi bi-check-lg me-1"></i>Update Schedule';
    }
  });

  loadJobs();
})();
</script>
{% endblock extra_js %}
